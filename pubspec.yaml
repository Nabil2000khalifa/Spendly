name: spendly
description: A beautiful full-featured personal finance and expense manager app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.68.0

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

  # CSV Export
  csv: ^6.0.0

  # Internationalization (Currency)
  intl: ^0.19.0

  # File System
  path_provider: ^2.1.3

  # Share Files
  share_plus: ^9.0.0

  # Local Preferences
  shared_preferences: ^2.3.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.5

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/icons/
